<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️Podcast Player</h1>
            <p>Listen to your favorite podcasts</p>
        </header>

        <div class="main">
            <div class="episodes">
                <h2>Episodes</h2>
                <div id="episodesList"></div>
            </div>

            <div class="player">
                <div class="now-playing">
                    <h3 id="currentTitle">Select an episode</h3>
                    <p id="currentPodcast">—</p>
                </div>

                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="small-btn" id="prevBtn">⏮ Prev</button>
                    <button class="play-btn" id="playBtn">▶ Play</button>
                    <button class="small-btn" id="nextBtn">Next ⏭</button>
                </div>

                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" id="volumeControl" min="0" max="100" value="70">
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>
</body>
</html>
