<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .episodes {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .episodes h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .episode-item {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .episode-item:hover {
            background: #f8f9ff;
            border-color: #667eea;
        }

        .episode-item.active {
            background: #e8eaf6;
            border-color: #667eea;
        }

        .episode-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .episode-podcast {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }

        .episode-duration {
            font-size: 0.85em;
            color: #999;
        }

        .player {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .now-playing {
            text-align: center;
        }

        .now-playing h3 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 5px;
        }

        .now-playing p {
            color: #666;
            font-size: 0.95em;
        }

        .progress-container {
            width: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #666;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .play-btn {
            padding: 14px 30px;
            font-size: 1.1em;
        }

        .small-btn {
            padding: 10px 15px;
            font-size: 0.9em;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-control input {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"] {
            accent-color: #667eea;
        }

        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Podcast Player</h1>
            <p>Listen to your favorite podcasts</p>
        </header>

        <div class="main">
            <div class="episodes">
                <h2>Episodes</h2>
                <div id="episodesList"></div>
            </div>

            <div class="player">
                <div class="now-playing">
                    <h3 id="currentTitle">Select an episode</h3>
                    <p id="currentPodcast">—</p>
                </div>

                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="small-btn" id="prevBtn">⏮ Prev</button>
                    <button class="play-btn" id="playBtn">▶ Play</button>
                    <button class="small-btn" id="nextBtn">Next ⏭</button>
                </div>

                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" id="volumeControl" min="0" max="100" value="70">
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const episodes = [
            { title: "Episode 1: Getting Started", podcast: "Tech Talk Daily", duration: "18:42", url: "https://www.soundhelix.com/sounds/mp3/SoundHelix-Song-1.mp3" },
            { title: "Episode 2: Advanced Topics", podcast: "Tech Talk Daily", duration: "25:15", url: "https://www.soundhelix.com/sounds/mp3/SoundHelix-Song-2.mp3" },
            { title: "Episode 3: Q&A Session", podcast: "Tech Talk Daily", duration: "22:30", url: "https://www.soundhelix.com/sounds/mp3/SoundHelix-Song-3.mp3" },
            { title: "Episode 1: Introduction", podcast: "Code Weekly", duration: "15:45", url: "https://www.soundhelix.com/sounds/mp3/SoundHelix-Song-4.mp3" },
            { title: "Episode 2: Best Practices", podcast: "Code Weekly", duration: "29:10", url: "https://www.soundhelix.com/sounds/mp3/SoundHelix-Song-5.mp3" },
        ];

        let currentEpisodeIndex = 0;
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeControl = document.getElementById('volumeControl');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const currentTitleEl = document.getElementById('currentTitle');
        const currentPodcastEl = document.getElementById('currentPodcast');
        const episodesList = document.getElementById('episodesList');

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function renderEpisodes() {
            episodesList.innerHTML = episodes.map((ep, i) => `
                <div class="episode-item ${i === currentEpisodeIndex ? 'active' : ''}" onclick="selectEpisode(${i})">
                    <div class="episode-title">${ep.title}</div>
                    <div class="episode-podcast">${ep.podcast}</div>
                    <div class="episode-duration">⏱ ${ep.duration}</div>
                </div>
            `).join('');
        }

        function selectEpisode(index) {
            currentEpisodeIndex = index;
            const episode = episodes[index];

            audio.src = episode.url;
            currentTitleEl.textContent = episode.title;
            currentPodcastEl.textContent = episode.podcast;
            playBtn.textContent = '▶ Play';

            renderEpisodes();
        }

        playBtn.addEventListener('click', () => {
            if (audio.src === '') selectEpisode(0);

            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸ Pause';
            } else {
                audio.pause();
                playBtn.textContent = '▶ Play';
            }
        });

        prevBtn.addEventListener('click', () => {
            currentEpisodeIndex = (currentEpisodeIndex - 1 + episodes.length) % episodes.length;
            selectEpisode(currentEpisodeIndex);
            audio.play();
            playBtn.textContent = '⏸ Pause';
        });

        nextBtn.addEventListener('click', () => {
            currentEpisodeIndex = (currentEpisodeIndex + 1) % episodes.length;
            selectEpisode(currentEpisodeIndex);
            audio.play();
            playBtn.textContent = '⏸ Pause';
        });

        volumeControl.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = progress + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            currentEpisodeIndex = (currentEpisodeIndex + 1) % episodes.length;
            selectEpisode(currentEpisodeIndex);
            audio.play();
        });

        audio.volume = 0.7;
        renderEpisodes();
    </script>
</body>
</html>
