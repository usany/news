name: News pipeline (cron)

on:
  schedule:
    # GitHub cron is always UTC.
    - cron: "26 11 * * *"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to build (YYYY-MM-DD), blank = current"
        required: false
        default: ""
      no_ocr:
        description: "Skip easyocr"
        type: boolean
        default: false

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      PYTHON: ${{ github.workspace }}/.venv/bin/python
    defaults:
      run:
        working-directory: packages/pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install easyocr
        if: ${{ !inputs.no_ocr }}
        run: uv sync --locked

      - name: Build scripts
        run: pnpm run build:scripts

      - name: Run pipeline
        run: |
          args=()
          if [ -n "${{ inputs.week }}" ]; then args+=("--week=${{ inputs.week }}"); fi
          if [ "${{ inputs.no_ocr }}" = "true" ]; then args+=(--no-ocr); fi
          pnpm exec tsx scripts/run_pipeline.ts "${args[@]}"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: |
            packages/pipeline/_workspace/
            packages/pipeline/store/
          if-no-files-found: ignore
          retention-days: 14
